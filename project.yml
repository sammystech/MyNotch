# Xcode project for release builds (Developer ID + notarization).
# Regenerate with `xcodegen generate`. Day-to-day dev can still use ./build.sh.
name: MyNotch
options:
  bundleIdPrefix: com.sammittman
  deploymentTarget:
    macOS: "14.0"
targets:
  MyNotch:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: MyNotch
        PRODUCT_BUNDLE_IDENTIFIER: com.sammittman.mynotch
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MyNotch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CH6CSBA54G
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        # Info.plist is the source of truth for versions.
        MARKETING_VERSION: ""
        CURRENT_PROJECT_VERSION: ""
    postBuildScripts:
      - name: Copy app icon
        script: cp "$SRCROOT/AppIcon.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
        inputFiles: [$(SRCROOT)/AppIcon.icns]
        outputFiles: [$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns]
